<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Almacén con microservicios</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #0f1117; color: #e6e6e6; margin: 0; padding: 18px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: #8fb8ff; text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: #9aa0ab; font-size: 13px; margin: 0 0 14px; max-width: 900px; }
  .panel { background: #171a22; border: 1px solid #262a35; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .servicios { display: flex; flex-wrap: wrap; gap: 8px; }
  .servicio { display: flex; align-items: center; gap: 8px; background: #11141b; border: 1px solid #262a35; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .servicio small { color: #9aa0ab; font-family: Consolas, monospace; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .pill.ok { background: #1f4d3a; color: #b7f3d6; } .pill.caido { background: #4d2323; color: #ffc7c7; } .pill.error { background: #4d3f23; color: #ffe2a8; }
  .columnas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 820px) { .columnas { grid-template-columns: 1fr; } }
  .producto { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21252f; font-size: 14px; }
  .producto:last-child { border-bottom: none; }
  .producto small { color: #9aa0ab; }
  .stock { font-weight: 700; }
  .aviso { color: #ffe2a8; font-size: 12px; margin-top: 6px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  form label { font-size: 12px; color: #9aa0ab; display: flex; flex-direction: column; gap: 4px; }
  form .ancho { grid-column: 1 / -1; }
  input, select { background: #0f1117; border: 1px solid #3a4256; color: #e6e6e6; border-radius: 4px; padding: 7px 8px; font-size: 14px; }
  button { background: #2f5d8a; color: #e6e6e6; border: 1px solid #3d76ad; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3a72a8; } button:disabled { opacity: .5; cursor: wait; }
  .resultado { margin-top: 10px; font-size: 13px; }
  .resultado ol { margin: 6px 0 0; padding-left: 20px; color: #c7ccd6; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #21252f; vertical-align: top; }
  th { color: #9aa0ab; font-weight: 600; }
  td.pasos { color: #9aa0ab; font-size: 12px; min-width: 260px; }
  .estado { font-weight: 700; white-space: nowrap; }
  .CONFIRMADO { color: #5cd08d; } .RECHAZADO_SIN_STOCK { color: #f0a35b; } .PAGO_RECHAZADO { color: #e6d36b; }
  .FALLIDO { color: #ff6b6b; } .PENDIENTE, .EN_PROCESO { color: #8fb8ff; }
  .vacio { color: #6b7180; font-size: 13px; }
</style>
</head>
<body>
  <h1>Almacén con microservicios</h1>
  <p class="sub">Esta página habla con el gateway, que reparte cada petición entre los servicios de catálogo, inventario, pedidos y pagos. Todo lo que ves viene de los servidores reales y se actualiza cada 2 segundos.</p>

  <div class="panel">
    <h2>Servicios</h2>
    <div class="servicios" id="servicios"></div>
  </div>

  <div class="columnas">
    <div class="panel">
      <h2>Catálogo e inventario</h2>
      <div id="productos"></div>
    </div>

    <div class="panel">
      <h2>Nuevo pedido</h2>
      <form id="formulario">
        <label>Producto<select id="producto"></select></label>
        <label>Cantidad<input id="cantidad" type="number" min="1" max="1000" value="2" required /></label>
        <label class="ancho">Cliente<input id="cliente" type="text" maxlength="40" value="Ana" required /></label>
        <div class="ancho"><button id="enviar" type="submit">Hacer pedido</button></div>
      </form>
      <div class="resultado" id="resultado"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Pedidos</h2>
    <div class="tabla" id="pedidos"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
